name: Uninstall tests

on:
  push:
    paths:
      - "src/AgenStart.Uninstall/**"
      - "tests/AgenStart.Uninstall.Tests/**"
      - ".github/workflows/uninstall-tests.yml"
      - "global.json"
  pull_request:
    paths:
      - "src/AgenStart.Uninstall/**"
      - "tests/AgenStart.Uninstall.Tests/**"
      - ".github/workflows/uninstall-tests.yml"
      - "global.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/AgenStart.Uninstall.Tests/AgenStart.Uninstall.Tests.csproj

      - name: Build
        run: dotnet build tests/AgenStart.Uninstall.Tests/AgenStart.Uninstall.Tests.csproj --configuration Release --no-restore

      - name: Format
        run: |
          dotnet format src/AgenStart.Uninstall/AgenStart.Uninstall.csproj --verify-no-changes --no-restore --verbosity minimal
          dotnet format tests/AgenStart.Uninstall.Tests/AgenStart.Uninstall.Tests.csproj --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        run: dotnet test --project tests/AgenStart.Uninstall.Tests/AgenStart.Uninstall.Tests.csproj --configuration Release --no-build
