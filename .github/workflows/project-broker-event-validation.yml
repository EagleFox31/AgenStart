name: Project broker delegated validation

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-broker:
    if: ${{ github.actor != 'EagleFox31' && startsWith(github.event.issue.title, '[broker-test]') }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-project-automation.yml@14d51168311c25f41d89df370c5e2ad2d5f42e83
    with:
      authentication: broker-user
      broker_url: ${{ vars.APPFACTORY_PROJECT_BROKER_URL }}
      broker_audience: appfactory-project-automation
      appfactory_ref: 14d51168311c25f41d89df370c5e2ad2d5f42e83
      config_path: .github/project-config.json
      issue_number: ${{ format('{0}', github.event.issue.number) }}
