name: AgenStart release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agenstart-release
  cancel-in-progress: false

jobs:
  release:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/release-dotnet-desktop.yml@v1
    with:
      project-path: src/AgenStart.Desktop/AgenStart.Desktop.csproj
      product-name: AgenStart
      runtime: win-x64
      dotnet-version: 10.0.x
      configuration: Release
      self-contained: true
    secrets:
      release_token: ${{ secrets.AGENSTART_RELEASE_TOKEN }}
