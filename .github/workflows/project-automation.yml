name: Project automation

on:
  issues:
    types: [opened, reopened, edited, closed]
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to resync; leave blank to bootstrap/reconcile the Project"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agenstart-project-automation-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number || 'bootstrap' }}
  cancel-in-progress: false

jobs:
  sync-project:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sync GitHub Project
        uses: EagleFox31/appfactory-project-automation@v1
        with:
          token: ${{ secrets.PROJECT_TOKEN }}
          config-path: .github/project-config.json
          issue-number: ${{ inputs.issue_number }}

  sync-project-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-project-automation.yml@7ff298087308d7ddcc8e507d8eb9adb56c2e2158
    with:
      authentication: github-app-user
      broker_url: ${{ vars.APPFACTORY_PROJECT_BROKER_URL }}
      broker_audience: appfactory-project-automation
      appfactory_ref: 7ff298087308d7ddcc8e507d8eb9adb56c2e2158
      config_path: .github/project-config.json
      issue_number: ${{ inputs.issue_number }}
